name: Release

# Push a tag like v1.0.0 (matching the version in package.json) to build the
# extension, attach the Web Store zip to a GitHub Release, and, once the store
# credentials are configured, upload it to the Chrome Web Store.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      zip: ${{ steps.pkg.outputs.zip }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm ci
      - id: pkg
        run: |
          npm run package
          echo "zip=$(ls testkube-for-github-*.zip)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pkg.outputs.zip }}
          generate_release_notes: true

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: ${{ steps.pkg.outputs.zip }}

  # Uploads the zip to the Chrome Web Store as a draft (no auto-publish) when
  # the store credentials exist. Set the repository variable
  # CHROME_EXTENSION_ID and the secrets CHROME_CLIENT_ID, CHROME_CLIENT_SECRET
  # and CHROME_REFRESH_TOKEN (see DEVELOPMENT.md); until then this job is skipped.
  webstore:
    needs: release
    if: vars.CHROME_EXTENSION_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upload to the Chrome Web Store
        env:
          EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: npx --yes chrome-webstore-upload-cli@3 upload --source "${{ needs.release.outputs.zip }}"
